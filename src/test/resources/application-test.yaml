spring:
  datasource:
    url: jdbc:h2:mem:authapi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    private-key-path: classpath:app.key
    public-key-path: classpath:app.pub
    expiration: 3600000
